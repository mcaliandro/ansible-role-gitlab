---

- name: Gather info about installed packages
  ansible.builtin.package_facts:
    manager: auto
  tags: install

- name: Setup environment variables for first GitLab installation
  ansible.builtin.set_fact:
    install_env: "{{ (install_env | default({})) | combine({item.key: item.value}) }}"
  with_dict: "{{ gitlab_installation_vars }}"
  when: gitlab_package not in ansible_facts.packages
  tags: install

- name: Include installation tasks per OS family
  ansible.builtin.include_tasks:
    file: "install/{{ ansible_facts.os_family }}.yml"
    apply:
      tags: install
  tags: install

- name: Replace gitlab.rb with a static configuration file
  ansible.builtin.copy:
    src: "{{ gitlab_config_file_src }}"
    dest: "{{ gitlab_config_file }}"
  no_log: true
  notify: Reload GitLab configuration
  when:
    - gitlab_config_file_src is defined
    - gitlab_config_file_src | length > 0
  tags: config

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
  tags: [always, config]

- name: Check if initial_root_password file exists
  ansible.builtin.stat:
    path: /etc/gitlab/initial_root_password
  register: password_file
  tags: config

- name: Fetch initial_root_password file
  ansible.builtin.fetch:
    src: /etc/gitlab/initial_root_password
    dest: "{{ inventory_dir }}/{{ inventory_hostname }}_initial_root_password"
  when:
    - gitlab_fetch_initial_root_password
    - password_file.stat.exists
  tags: config

- name: Running checks on GitLab server
  ansible.builtin.include_tasks:
    file: checks.yml
    apply:
      tags: checks
  tags: checks
