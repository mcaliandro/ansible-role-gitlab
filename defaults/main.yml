---

# Select the GitLab edition to install.
# 'ce' -> Community Edition (default)
# 'ee' -> Enterprise Edition
gitlab_edition: ce

# Specify the version of GitLab to install.
# If empty (default), the role installs the latest version available.
gitlab_version: ""

# Use the dictionary `gitlab_installation_vars` to define the environment
# variables useful to configure GitLab at installation time.
# ref: https://docs.gitlab.com/install/package/ubuntu/#advanced-configuration
#
# Setting `EXTERNAL_URL` is optional but recommended.
#
# Example:
#   gitlab_installation_vars:
#     EXTERNAL_URL: "http://gitlab.example.com"
#     GITLAB_ROOT_EMAIL: "admin@example.com"
#     GITLAB_ROOT_PASSWORD: "strong-password"
#
gitlab_installation_vars: {}

# Whether to use or not the fetch module to download 'initial_root_password'
# file locally from the remote host.
gitlab_fetch_initial_root_password: false

# Specify a destionation path where to download 'initial_root_password' file.
# NOTE: fetch module is configured with parameter `flat=true` by default.
gitlab_fetch_initial_root_password_dest: "/tmp/{{ inventory_hostname }}/initial_root_password"

# Replace gitlab.rb file on the target host with a custom configuration file
# using `copy` module. By default, the role does not touch the remote file.
#
# Example:
#   gitlab_custom_config_file: gitlab.custom.rb
#
gitlab_custom_config_file: ""
